name: Java regression checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          find src -name '*.java' > sources.txt
          javac --release 21 -encoding UTF-8 -d out @sources.txt
      - name: Business regression checks
        run: java -cp out posTest.RegressionTest
      - name: Swing panels and checkout workflow
        run: xvfb-run -a java -cp out posUi.WorkflowTest
